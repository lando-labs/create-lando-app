name: Publish

# Publishes to public npmjs with SLSA provenance on tag push, and creates a
# GitHub Release from the tag's annotated message. Triggered by pushing a
# semver tag (v0.1.0, v0.1.1, …). The tag must match package.json exactly.
#
# Auth is npm TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN secret. npm mints a
# short-lived credential from this workflow's OIDC identity, which must match the
# Trusted Publisher configured on the package (npmjs.com → create-lando-app →
# Settings → Trusted publishing: this repo + this workflow file). The package must
# already exist on npm before a Trusted Publisher can be configured, so the very
# first publish was a one-off manual `npm publish` (see repo notes); every release
# after that runs keyless here.

on:
  push:
    tags:
      - 'v*.*.*'

# id-token: write is REQUIRED for trusted publishing (OIDC) and provenance.
# contents: write is required to create the GitHub Release.
permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Trusted publishing requires Node >= 22.14.0 AND npm >= 11.5.1.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Node 22's bundled npm is 10.x; trusted publishing needs >= 11.5.1, so
      # upgrade the CLI before we publish.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $PKG_VERSION"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tarball contents
        run: |
          echo "Files that will ship:"
          npm pack --dry-run 2>&1 | grep -E "npm notice [0-9]" | head -30
          echo "..."
          npm pack --dry-run 2>&1 | tail -5

      # No NODE_AUTH_TOKEN: auth is OIDC (trusted publishing). npm exchanges this
      # job's id-token for a short-lived publish credential, and --provenance is
      # attested from the same OIDC identity (public repo + public package).
      - name: Publish to npm (trusted publishing + provenance)
        run: npm publish --provenance --access public

      - name: Create GitHub Release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "$TAG_MSG" ]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "$TAG_MSG"
          fi
