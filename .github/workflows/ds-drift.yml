name: DS Drift

# Receiver half of the CI-push drift mechanism (CLAUDE.md → "Drift mechanism").
#
# The design-system is the source of truth for the #462 cascade-layer contract,
# but this repo owns the templates. When the DS publishes a new version, its
# release workflow dispatches `ds-published` here; this workflow bumps the
# DS_VERSION constant and opens a PR. The PR's CI runs the consumer smoke test
# (test.yml), which is the REAL guard — a version bump alone can't catch a
# layer-contract break, only scaffold → install → build → assert can.
#
# STATUS: dormant until (a) the DS is on public npm and (b) the DS-side
# dispatcher exists (tracked in the DS repo). Until then it can be exercised
# manually via workflow_dispatch.

on:
  # Fired by the DS release workflow: client_payload.version = new DS version.
  repository_dispatch:
    types: [ds-published]
  # Manual trigger for testing before the DS-side dispatcher is wired.
  workflow_dispatch:
    inputs:
      version:
        description: 'DS version to pin (e.g. 0.51.0, with or without a leading ^ or v)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump DS_VERSION and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Resolve token (prefer PAT so the PR triggers CI)
        id: token
        env:
          # A PAT is REQUIRED for the smoke test to run on the drift PR:
          # PRs opened by the default GITHUB_TOKEN do NOT trigger `pull_request`
          # workflows (GitHub's recursion guard). Set repo secret DRIFT_PAT
          # (repo scope) to a fine-grained/classic token so test.yml runs.
          DRIFT_PAT: ${{ secrets.DRIFT_PAT }}
        run: |
          if [ -n "$DRIFT_PAT" ]; then
            echo "value=$DRIFT_PAT" >> "$GITHUB_OUTPUT"
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DRIFT_PAT not set — the drift PR's smoke test will NOT auto-run. A maintainer must close/reopen the PR (or push an empty commit) to trigger CI."
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.token.outputs.value }}

      - name: Normalize version
        id: ver
        run: |
          RAW="${{ github.event.client_payload.version || inputs.version }}"
          if [ -z "$RAW" ]; then
            echo "::error::No version provided (client_payload.version / inputs.version empty)"
            exit 1
          fi
          # Strip a leading 'v' or '^' — we always pin as a caret range.
          CLEAN="$(echo "$RAW" | sed -E 's/^[v^]+//')"
          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "branch=drift/ds-$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Bump DS_VERSION constant
        id: bump
        run: |
          FILE="src/scaffold.ts"   # DS_VERSION lives here (imported by the CLI)
          NEW="^${{ steps.ver.outputs.clean }}"
          OLD="$(sed -nE "s/.*export const DS_VERSION = '([^']*)'.*/\1/p" "$FILE")"
          echo "Current: $OLD → New: $NEW"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "DS_VERSION already $NEW — nothing to do."
            exit 0
          fi
          sed -i -E "s/(export const DS_VERSION = ')[^']*(')/\1$NEW\2/" "$FILE"
          # Verify the edit took. Use fixed-string match — version strings
          # contain regex metacharacters (^, .) that break a plain grep.
          grep -qF "export const DS_VERSION = '$NEW'" "$FILE" || {
            echo "::error::Failed to rewrite DS_VERSION in $FILE"; exit 1;
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Create branch, commit, and open PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          BRANCH="${{ steps.ver.outputs.branch }}"
          NEW="${{ steps.bump.outputs.new }}"
          OLD="${{ steps.bump.outputs.old }}"
          CLEAN="${{ steps.ver.outputs.clean }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add src/scaffold.ts
          git commit \
            -m "[drift] Bump DS_VERSION $OLD -> $NEW" \
            -m "Auto-generated from a design-system release. The smoke test on this PR is the real #462 cascade-layer guard. Refs: #2"
          git push -f origin "$BRANCH"

          # Build the PR body via echo (avoids heredoc indentation leaking into
          # the markdown under YAML's block scalar).
          {
            echo "## Automated design-system drift bump"
            echo ""
            echo "The design-system published \`$CLEAN\`. This PR bumps the \`DS_VERSION\` constant the scaffold pins (\`src/scaffold.ts\`):"
            echo ""
            echo "\`$OLD\` -> \`$NEW\`"
            echo ""
            echo "### The real check is the smoke test"
            echo "A version bump alone can't catch a cascade-layer contract break (#462). The **consumer smoke test** on this PR scaffolds the template, installs this DS version, runs \`next build\`, and asserts \`app-reset\` is still the lowest cascade layer. **Do not merge if it fails** — the template needs updating in lockstep with the DS."
            echo ""
            echo "> If no checks appear below, \`DRIFT_PAT\` wasn't set — close/reopen this PR (or push an empty commit) to trigger CI."
            echo ""
            echo "Refs #2."
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[drift] Bump DS_VERSION to $NEW" \
            --body-file pr-body.md

      - name: Nothing to do
        if: steps.bump.outputs.changed != 'true'
        run: echo "DS_VERSION already current — no PR opened."
